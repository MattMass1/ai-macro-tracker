name: MacroTracker
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.biz21.macrotracker
    INFOPLIST_FILE: MacroTracker/Info.plist
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  MacroTracker:
    type: application
    platform: iOS
    sources: [MacroTracker]
    settings:
      base:
        PRODUCT_NAME: MacroTracker
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
  MacroTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MacroTrackerTests]
    dependencies:
      - target: MacroTracker

