services:
  - type: web
    name: macro-tracker
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    # Render injects service env vars into pre-deploy commands. The runner
    # validates DATABASE_URL and prints only database name + host class.
    preDeployCommand: python src/migrations.py
    startCommand: python src/server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: APP_SHARED_TOKEN
        generateValue: true
      - key: OPENAI_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FATSECRET_CONSUMER_KEY
        sync: false
      - key: FATSECRET_CONSUMER_SECRET
        sync: false
      - key: FATSECRET_CLIENT_ID
        sync: false
      - key: FATSECRET_CLIENT_SECRET
        sync: false
      - key: FATSECRET_ATTRIBUTION_ENABLED
        value: "false"
      - key: FATSECRET_CACHE_ALLOWED
        value: "false"
      # Release gates for unknown (NULL) nutrients. Keep unset until the owner
      # approves each step; see docs/rollback/003_calorie_only_unknown_macros.md.
      # APPROVED_MIGRATIONS=003_calorie_only_unknown_macros.sql:<sha256> releases 003.
      - key: APPROVED_MIGRATIONS
        sync: false
      - key: CALORIE_ONLY_WRITES_ENABLED
        value: "false"
      - key: CALORIE_ONLY_WRITES_USER_IDS
        sync: false
      - key: LOCAL_TZ
        value: America/New_York
      - key: DAY_ROLLOVER_HOUR
        value: "4"
      - key: ALLOWED_ORIGINS
        sync: false
