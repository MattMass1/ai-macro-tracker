services:
  - type: web
    name: macro-tracker
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python src/server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: APP_SHARED_TOKEN
        generateValue: true
      - key: OPENAI_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LOCAL_TZ
        value: America/New_York
      - key: DAY_ROLLOVER_HOUR
        value: "4"
      - key: ALLOWED_ORIGINS
        sync: false
